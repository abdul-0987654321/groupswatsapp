<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung – Coaching-Dashboard</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:,">
<script src="/i18n.js"></script>
</head>
<body>
<main>
  <form class="card login" method="post" action="/login">
    <span id="langSwitch"></span>
    <h1>Coaching-Dashboard</h1>
    <p class="muted">Bitte melde dich mit dem Dashboard-Passwort an.</p>
    <p id="err" class="banner err" hidden>Falsches Passwort.</p>
    <p><input type="password" name="password" placeholder="Passwort" autofocus required></p>
    <button class="primary" type="submit">Anmelden</button>
  </form>
</main>
<script>
document.getElementById('langSwitch').outerHTML = '<span class="lang-switch">' + ['de', 'en'].map((l) => `<button type="button" class="${(window.dashboardLang || 'de') === l ? 'on' : ''}" onclick="setDashboardLang('${l}')">${l.toUpperCase()}</button>`).join('') + '</span>';
if (location.search.includes('fehler')) document.getElementById('err').hidden = false;</script>
</body>
</html>
