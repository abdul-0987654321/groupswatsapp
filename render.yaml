# Render Blueprint (optional — you can also create the Web Service by hand with the same values).
services:
  - type: web
    name: coaching-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Europe/Berlin
      - key: SHEET_WEBHOOK_URL
        sync: false
      - key: SHEET_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
